name: review

# pull_request_target takes this file from the default branch, so a pull
# request cannot change its own review. The job checks nothing out, which
# is why zizmor's dangerous-triggers finding is ignored here.
on: pull_request_target  # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  cite:
    # Forks are not reviewed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: elecnix/cite@db01467aae47c33f16ec6b404d3cdbd13ec94f12  # v0.15.1
        with:
          # The staging Switch reads the schema from a forced tool call.
          model_api_key: ${{ secrets.REVIEW_MODEL_API_KEY }}
          model_base_url: ${{ secrets.REVIEW_MODEL_BASE_URL }}
          model_id: ${{ vars.REVIEW_MODEL_ID }}
          structured_output: tools
