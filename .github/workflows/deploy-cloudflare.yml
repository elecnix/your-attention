name: deploy-cloudflare

# Run by hand from the Actions tab. `cloudflare/main.tf` creates the KV namespace, the R2 bucket and the
# deploy token. The workflow needs, in the "cloudflare" environment:
#   secrets   CLOUDFLARE_API_TOKEN (the deploy token: Workers Scripts Write, Account Settings Read) and CLOUDFLARE_ACCOUNT_ID
#   variable  KV_NAMESPACE_ID, the namespace for invite codes and inbox ids
#   secret    OWNER_TOKEN, in single mode: the owner token the Worker gets as its OWNER_TOKEN secret
#   secret    INBOX_ID_SECRET, in hosted mode: the key that signs inbox addresses. Changing it makes every address invalid
on:
  workflow_dispatch:
    inputs:
      mode:
        description: single serves one inbox; hosted serves many, with invite codes
        type: choice
        options: [single, hosted]
        default: single

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check before deploying
        run: npm run typecheck && npm run test:unit && npm run test:cloudflare
      - name: check the credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          INBOX_ID_SECRET: ${{ secrets.INBOX_ID_SECRET }}
          MODE: ${{ inputs.mode }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KV_NAMESPACE_ID" ] || missing="$missing KV_NAMESPACE_ID"
          if [ "$MODE" = single ]; then [ -n "$OWNER_TOKEN" ] || missing="$missing OWNER_TOKEN"; fi
          if [ "$MODE" = hosted ]; then [ -n "$INBOX_ID_SECRET" ] || missing="$missing INBOX_ID_SECRET"; fi
          if [ -n "$missing" ]; then echo "::error::the cloudflare environment lacks:$missing"; exit 1; fi
          if [ "$MODE" = single ] && ! printf %s "$OWNER_TOKEN" | grep -Eq '^[0-9a-f]{12}\.[0-9a-f]{64}$'; then echo "::error::OWNER_TOKEN must be 12 hex digits, a dot, and 64 hex digits"; exit 1; fi
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_NAMESPACE_ID}/" wrangler.jsonc
          npm run cloudflare:build
          npx wrangler deploy --var "MODE:${MODE}"
      - name: set the owner token
        if: inputs.mode == 'single'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          printf %s "$OWNER_TOKEN" | npx wrangler secret put OWNER_TOKEN
      - name: set the inbox address key
        if: inputs.mode == 'hosted'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOX_ID_SECRET: ${{ secrets.INBOX_ID_SECRET }}
        run: printf %s "$INBOX_ID_SECRET" | npx wrangler secret put INBOX_ID_SECRET
