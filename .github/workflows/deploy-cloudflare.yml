name: deploy-cloudflare

# Run by hand from the Actions tab. It needs, in the "cloudflare" environment:
#   secrets   CLOUDFLARE_API_TOKEN (Workers, Durable Objects, R2 and KV edit) and CLOUDFLARE_ACCOUNT_ID
#   variable  KV_NAMESPACE_ID, the namespace for invite codes and inbox ids (`wrangler kv namespace create INVITES`)
# In single mode, also set the OWNER_TOKEN secret on the Worker: `wrangler secret put OWNER_TOKEN`.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: single serves one inbox; hosted serves many, with invite codes
        type: choice
        options: [single, hosted]
        default: single

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check before deploying
        run: npm run typecheck && npm run test:unit && npm run test:cloudflare
      - name: check the credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KV_NAMESPACE_ID" ] || missing="$missing KV_NAMESPACE_ID"
          if [ -n "$missing" ]; then echo "::error::the cloudflare environment lacks:$missing"; exit 1; fi
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_NAMESPACE_ID}/" wrangler.jsonc
          npx wrangler r2 bucket create your-attention-files || echo "the bucket exists already"
          npm run cloudflare:build
          npx wrangler deploy --var "MODE:${MODE}"
