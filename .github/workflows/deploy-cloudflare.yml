name: deploy-cloudflare

# Run by hand from the Actions tab. `cloudflare/main.tf` creates the KV namespace, the R2 bucket and the
# deploy token. The workflow needs, in the "cloudflare" environment:
#   secrets   CLOUDFLARE_API_TOKEN (the deploy token: Workers Scripts Write, Account Settings Read) and CLOUDFLARE_ACCOUNT_ID
#   variable  KV_NAMESPACE_ID, the namespace for invite codes and inbox ids
#   secret    OWNER_TOKEN, in single mode: the owner token the Worker gets as its OWNER_TOKEN secret
#   secret    INBOX_ID_SECRET, in hosted mode: the key that signs inbox addresses. Changing it makes every address invalid
# One dispatch deploys both Workers: the telemetry collector first, then the inbox. The collector
# (wrangler.telemetry.jsonc) reads no secrets or variables, so it needs nothing extra.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: single serves one inbox; hosted serves many, with invite codes
        type: choice
        options: [single, hosted]
        default: single
      code_update:
        description: deferred gives an object a minute to finish; immediate resets it at once, for a correction that cannot wait
        type: choice
        options: [deferred, immediate]
        default: deferred

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  # Laptop inboxes post their daily reports here, so it deploys first and its failure stops the inbox deploy.
  deploy-telemetry:
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check before deploying
        # Each test prints a block of TAP, which kept this step at some twelve thousand lines. The output goes to a
        # file: a failure shows its tail, and a pass shows the counts.
        run: |
          fail() { echo "::error::$1 failed"; tail -50 check.log; exit 1; }
          npm run typecheck > check.log 2>&1 || fail typecheck
          npm run test:unit > check.log 2>&1 || fail "unit tests"
          npm run test:cloudflare > check.log 2>&1 || fail "cloudflare tests"
          grep -E "^# (pass|fail)|^ℹ (pass|fail)" check.log || tail -5 check.log
      - name: check the credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::the cloudflare environment lacks:$missing"; exit 1; fi
      - name: deploy the telemetry collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.telemetry.jsonc

  deploy:
    needs: deploy-telemetry
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check before deploying
        # Each test prints a block of TAP, which kept this step at some twelve thousand lines. The output goes to a
        # file: a failure shows its tail, and a pass shows the counts.
        run: |
          fail() { echo "::error::$1 failed"; tail -50 check.log; exit 1; }
          npm run typecheck > check.log 2>&1 || fail typecheck
          npm run test:unit > check.log 2>&1 || fail "unit tests"
          npm run test:cloudflare > check.log 2>&1 || fail "cloudflare tests"
          grep -E "^# (pass|fail)|^ℹ (pass|fail)" check.log || tail -5 check.log
      - name: check the credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          INBOX_ID_SECRET: ${{ secrets.INBOX_ID_SECRET }}
          MODE: ${{ inputs.mode }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KV_NAMESPACE_ID" ] || missing="$missing KV_NAMESPACE_ID"
          if [ "$MODE" = single ]; then [ -n "$OWNER_TOKEN" ] || missing="$missing OWNER_TOKEN"; fi
          if [ "$MODE" = hosted ]; then [ -n "$INBOX_ID_SECRET" ] || missing="$missing INBOX_ID_SECRET"; fi
          if [ -n "$missing" ]; then echo "::error::the cloudflare environment lacks:$missing"; exit 1; fi
          if [ "$MODE" = single ] && ! printf %s "$OWNER_TOKEN" | grep -Eq '^[0-9a-f]{12}\.[0-9a-f]{64}$'; then echo "::error::OWNER_TOKEN must be 12 hex digits, a dot, and 64 hex digits"; exit 1; fi
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          MODE: ${{ inputs.mode }}
          CODE_UPDATE: ${{ inputs.code_update }}
        run: |
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_NAMESPACE_ID}/" wrangler.jsonc
          npm run cloudflare:build
          # The flag wants a duration with deferred, and its absence is what failed the deploy of 16 November.
          if [ "$CODE_UPDATE" = immediate ]; then mode=immediate; else mode="deferred 60s"; fi
          # Wrangler prints its whole help on an error, so the log stays in a file: a failure shows its tail, and a
          # success shows the four lines that say what happened.
          if ! npx wrangler deploy --var "MODE:${MODE}" --durable-objects-code-update-mode "$mode" > deploy.log 2>&1; then
            tail -30 deploy.log
            exit 1
          fi
          grep -E "Uploaded|Deployed|Current Version" deploy.log || true
      - name: set the owner token
        if: inputs.mode == 'single'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          printf %s "$OWNER_TOKEN" | npx wrangler secret put OWNER_TOKEN
      - name: set the inbox address key
        if: inputs.mode == 'hosted'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOX_ID_SECRET: ${{ secrets.INBOX_ID_SECRET }}
        run: printf %s "$INBOX_ID_SECRET" | npx wrangler secret put INBOX_ID_SECRET
