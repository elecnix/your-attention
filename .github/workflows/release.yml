name: release

# A tag that names the version package.json declares is the release: it publishes the
# package to npm when NPM_TOKEN is set, then creates the GitHub release whose tag the
# Homebrew formula and livecheck read. Nothing here runs on a branch.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm publish --provenance signs an attestation with the job's OIDC token.
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: the tag names the version package.json declares
        # A tag on a commit whose version says something else ships a package nobody can
        # identify, and the formula then pins a URL that never existed. Fail before that.
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $version in package.json"
            exit 1
          fi
      - name: publish to npm
        # The guard is a shell test, not a step condition: GitHub refuses to read `secrets` in an
        # `if`, and that refusal is a startup failure, which runs no step at all.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set: skipping the npm publish, and creating the release alone"
            exit 0
          fi
          npm publish --provenance --access public
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
