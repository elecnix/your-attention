name: dupdelta

on:
  pull_request:

permissions:
  contents: read

jobs:
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0  # dupdelta compares against the merge-base
          persist-credentials: false
      - uses: elecnix/dupdelta@c95b985a8e9ba75c1473f2fe3695d8478f869d53  # v0.3.0
