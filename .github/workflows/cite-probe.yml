name: cite probe
# Temporary: resolves and runs both Cite pins with dry_run, to tell whether the
# pinned action is what makes the review workflow fail at startup. Removed
# before merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  v0160:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: elecnix/cite@e790f27116e76c26aa8b4f6c6437c5bec6c5cc30 # v0.16.0
        with:
          model_api_key: ${{ secrets.REVIEW_MODEL_API_KEY }}
          model_base_url: ${{ vars.REVIEW_MODEL_BASE_URL }}
          model_id: ${{ vars.REVIEW_MODEL_ID }}
          structured_output: ${{ vars.REVIEW_MODEL_STRUCTURED_OUTPUT }}
          dry_run: 'true'
  v0161:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: elecnix/cite@1460a96b67ac425466c7bde99597d1e312ee8408 # v0.16.1
        with:
          model_api_key: ${{ secrets.REVIEW_MODEL_API_KEY }}
          model_base_url: ${{ vars.REVIEW_MODEL_BASE_URL }}
          model_id: ${{ vars.REVIEW_MODEL_ID }}
          structured_output: ${{ vars.REVIEW_MODEL_STRUCTURED_OUTPUT }}
          dry_run: 'true'
