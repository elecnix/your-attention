name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (${{ matrix.checker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [tsgo, tsc-rs]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:${{ matrix.checker }}

  cloudflare:
    # The Worker as it would deploy: a dry-run bundle, then the hosted build on workerd with local Durable Objects, R2 and KV.
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dry-run deploy
        run: npm run cloudflare:check
      - name: Durable Object and Worker tests
        run: npm run test:cloudflare

  browser:
    # Playwright on the page, with two people in two browser contexts, and every Storybook story.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: build the stories
        run: npm run storybook:build
      - name: browser tests
        run: npm run test:browser

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit tests
        run: npm run test:unit
      - name: integration tests
        run: npm run test:integration
        env:
          # GitHub's macOS runners drop multicast, so the mDNS test finds
          # nothing there. It runs on Linux and Windows, and on a real Mac.
          YOUR_ATTENTION_SKIP_MDNS: ${{ matrix.os == 'macos-latest' && '1' || '' }}
